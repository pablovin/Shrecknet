services:
  # Redis - Message broker for Celery
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Neo4j - Graph database
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/VeryStrongPass123
      # Only APOC plugin for performance on limited resources
      # Removed graph-data-science plugin to reduce memory footprint
      - NEO4J_PLUGINS=["apoc"]
      # Optimized memory settings for limited RAM (16GB)
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_jvm_additional=-XX:+UseG1GC
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "VeryStrongPass123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend_2 - Main application
  backend_2:
    build:
      context: ./backend_2
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BACKEND_2_NEO4J_URI=bolt://neo4j:7687
      - BACKEND_2_NEO4J_USER=neo4j
      - BACKEND_2_NEO4J_PASSWORD=VeryStrongPass123
      - BACKEND_2_NEO4J_DATABASE=neo4j
      - BACKEND_2_CELERY_BROKER_URL=redis://redis:6379/0
      - BACKEND_2_CELERY_RESULT_BACKEND=redis://redis:6379/1
      - BACKEND_2_CELERY_TASK_ALWAYS_EAGER=false
      - BACKEND_2_DATABASE_URL=sqlite+aiosqlite:////data/backend_2.db
      - BACKEND_2_JOBS_DATABASE_URL=sqlite+aiosqlite:////data/backend_2_jobs.db
      - BACKEND_2_MEDIA_ROOT=/app/media
    volumes:
      # Persistent media files
      - backend-media:/app/media
      # Persistent SQLite databases
      - backend-data:/data
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Backend_2 Celery Worker
  backend_2_worker:
    build:
      context: ./backend_2
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - BACKEND_2_NEO4J_URI=bolt://neo4j:7687
      - BACKEND_2_NEO4J_USER=neo4j
      - BACKEND_2_NEO4J_PASSWORD=VeryStrongPass123
      - BACKEND_2_NEO4J_DATABASE=neo4j
      - BACKEND_2_CELERY_BROKER_URL=redis://redis:6379/0
      - BACKEND_2_CELERY_RESULT_BACKEND=redis://redis:6379/1
      - BACKEND_2_CELERY_TASK_ALWAYS_EAGER=false
      - BACKEND_2_DATABASE_URL=sqlite+aiosqlite:////data/backend_2.db
      - BACKEND_2_JOBS_DATABASE_URL=sqlite+aiosqlite:////data/backend_2_jobs.db
      - BACKEND_2_MEDIA_ROOT=/app/media
    volumes:
      # Share media and database with main app
      - backend-media:/app/media
      - backend-data:/data
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      backend_2:
        condition: service_started

volumes:
  redis-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  backend-media:
  backend-data: