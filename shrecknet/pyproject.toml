[project]
name = "shrecknet"
version = "0.5.6"
description = "Shrecknet core platform (world graph, ontology, agents, identity)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<0.112",
  "uvicorn[standard]>=0.27,<0.31",
  "SQLAlchemy>=2.0,<2.1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<0.29",
  "Pillow>=10,<12",
  "celery>=5.3,<6",
  "redis>=5,<6",
  "neo4j>=5.20,<6",
  "openai>=1.30,<2",
  "tiktoken>=0.7,<1",
  "langchain-core>=0.2,<0.4",
  "langchain-openai>=0.1.8,<0.3",
  "numpy>=1.26,<3",
  "sentence-transformers>=2.7,<4",
  "PyPDF2>=3.0,<4",
  "PyMuPDF>=1.23,<2",
  "pytesseract>=0.3.10,<0.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
pythonpath = ["."]
