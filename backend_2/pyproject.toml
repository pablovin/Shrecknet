[project]
name = "backend_2"
version = "0.1.0"
description = "Ontology management backend service"
authors = [
    { name = "Shrecknet Team", email = "team@shrecknet.local" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<0.111",
    "uvicorn[standard]>=0.27,<0.28",
    "SQLAlchemy>=2.0,<2.1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "alembic>=1.13,<1.14",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[argon2]>=1.7,<2",
    "email-validator>=2.1,<3",
    "python-multipart>=0.0.9,<1",
    "Pillow>=10,<11"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "httpx>=0.25",
    "pytest-asyncio>=0.21"
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["app"]
addopts = "-q"
