name: Ontology Studio backend tests

on:
  pull_request:
    paths:
      - "shreckworld/app/models/ontology_studio.py"
      - "shreckworld/app/services/ontology_studio.py"
      - "shreckworld/app/services/ontology_compact.py"
      - "shreckworld/app/integrations/shreckllm.py"
      - "shreckworld/app/services/ontology_run_reporting.py"
      - "shreckworld/app/services/ontology_discovery_batches.py"
      - "shreckworld/app/api/routers/ontology_studio.py"
      - "shreckworld/app/tasks/architect_learn_ontology.py"
      - "shreckworld/tests/test_ontology_studio.py"
      - "shreckworld/tests/test_ontology_schema_v3.py"
      - "shreckworld/tests/test_ontology_discovery_batches.py"
      - "shreckworld/tests/test_ontology_job_monitor.py"
      - "shreckconfig/**"
      - ".github/workflows/test-ontology-studio.yml"
  workflow_dispatch:

jobs:
  ontology-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "SQLAlchemy>=2.0,<2.1" "pydantic>=2.6,<3" \
            "pydantic-settings>=2.2,<3" "fastapi>=0.110,<0.112" \
            "httpx>=0.27,<0.29" "neo4j>=5.20,<7" "python-multipart>=0.0.9,<1" \
            "python-jose[cryptography]>=3.3,<4" "python-dotenv>=1,<2" "PyYAML>=6"
          python -m pip install -e ./shreckconfig --no-deps
          python -m pip install -e ./shreckdoc --no-deps
      - name: Compile Ontology Studio
        run: |
          python -m compileall -q shreckworld/app/models/ontology_studio.py \
            shreckworld/app/services/ontology_studio.py \
            shreckworld/app/services/ontology_compact.py \
            shreckworld/app/integrations/shreckllm.py \
            shreckworld/app/services/ontology_run_reporting.py \
            shreckworld/app/services/ontology_discovery_batches.py \
            shreckworld/app/api/routers/ontology_studio.py \
            shreckworld/app/tasks/architect_learn_ontology.py \
            shrecknet/app/core/config_store.py \
            shrecknet/app/api/routers/configurations.py
      - name: Focused ontology regression tests
        working-directory: shreckworld
        run: python -m pytest tests/test_ontology_studio.py tests/test_ontology_discovery_batches.py tests/test_ontology_job_monitor.py tests/test_ontology_schema_v3.py -q
