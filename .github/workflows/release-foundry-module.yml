name: Release Foundry module

on:
  push:
    branches:
      - main
    paths:
      - "integrations/foundry/shrecknet-foundry/module.json"
    tags:
      - "foundry-v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish Foundry module
    runs-on: ubuntu-latest
    env:
      MODULE_DIR: integrations/foundry/shrecknet-foundry
      MODULE_ID: shrecknet-foundry
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release version and module files
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          manifest="$MODULE_DIR/module.json"
          version="$(node -p "require('./' + process.argv[1]).version" "$manifest")"
          tag="foundry-v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          test "$(node -p "require('./' + process.argv[1]).id" "$manifest")" = "$MODULE_ID"
          expected_download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${MODULE_ID}-v${version}.zip"
          test "$(node -p "require('./' + process.argv[1]).download" "$manifest")" = "$expected_download"
          node --check "$MODULE_DIR/scripts/main.js"
          node --check "$MODULE_DIR/scripts/api/shrecknet-client.js"
          node --check "$MODULE_DIR/scripts/apps/shrecknet-shell.js"
          node --check "$MODULE_DIR/scripts/apps/shrecknet-connection-settings.js"
          node --check "$MODULE_DIR/scripts/settings/connection-monitor.js"
          node --test "$MODULE_DIR"/tests/*.test.mjs
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and validate release ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.metadata.outputs.version }}"
          asset_name="${MODULE_ID}-v${version}.zip"
          asset_path="$RUNNER_TEMP/$asset_name"
          (
            cd "$MODULE_DIR"
            zip -qr "$asset_path" . -x '.DS_Store' -x '__MACOSX/*'
          )
          unzip -Z1 "$asset_path" | grep -Fx 'module.json'
          unzip -Z1 "$asset_path" | grep -Fx 'scripts/main.js'
          unzip -Z1 "$asset_path" | grep -Fx 'templates/shell.hbs'
          unzip -Z1 "$asset_path" | grep -Fx 'templates/connection-settings.hbs'
          unzip -Z1 "$asset_path" | grep -Fx 'assets/shrecknet-logo.svg'
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.metadata.outputs.tag }}" "${{ steps.package.outputs.asset_path }}#${{ steps.package.outputs.asset_name }}" "$MODULE_DIR/module.json" \
            --target "$GITHUB_SHA" \
            --title "Shrecknet Foundry ${{ steps.metadata.outputs.version }}" \
            --notes-file "changelogs/foundry-v${{ steps.metadata.outputs.version }}.md"
