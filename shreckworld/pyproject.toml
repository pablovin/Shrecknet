[project]
name = "shreckworld"
version = "0.1.0"
description = "Standalone ShreckWorld knowledge service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<0.112",
  "uvicorn>=0.27,<0.31",
  "SQLAlchemy>=2.0,<2.1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "celery>=5.3,<6",
  "redis>=5,<6",
  "PyPDF2>=3.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27,<0.29"]
semantic = ["sentence-transformers>=2.7,<4"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
