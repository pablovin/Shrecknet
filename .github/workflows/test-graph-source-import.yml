name: ShreckWorld graph source import tests

on:
  push:
    branches:
      - feature/graph-narrative-sources-import
    paths:
      - "shreckworld/**"
      - ".github/workflows/test-graph-source-import.yml"
  pull_request:
    paths:
      - "shreckworld/**"
  workflow_dispatch:

jobs:
  graph-source-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight source-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "SQLAlchemy>=2.0,<2.1" "pydantic>=2.6,<3" \
            "pydantic-settings>=2.2,<3" "fastapi>=0.110,<0.112" \
            "httpx>=0.27,<0.29" "neo4j>=5.20,<7" "python-multipart>=0.0.9,<1" \
            "python-jose[cryptography]>=3.3,<4" "python-dotenv>=1,<2" "PyYAML>=6"
          python -m pip install -e ./shreckconfig --no-deps
          python -m pip install -e ./shreckdoc --no-deps
      - name: Compile importer and supporting sources
        run: |
          python -m compileall -q shreckworld/app/services/graph_source_import.py shreckworld/app/services/source_assets.py shreckworld/app/services/source_workspace.py shreckworld/app/schemas/sources.py
      - name: Test graph source import and source organization
        working-directory: shreckworld
        run: python -m pytest tests/test_graph_source_import.py tests/test_sources_workspace.py -q
