[project]
name = "shreckworld"
version = "0.1.0"
description = "Standalone ShreckWorld knowledge service"
requires-python = ">=3.10"
dependencies = [
  "shreckconfig>=0.1,<0.2",
  "shreckdoc>=0.1,<0.2",
  "fastapi>=0.110,<0.112",
  "uvicorn>=0.27,<0.31",
  "SQLAlchemy>=2.0,<2.1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "celery[redis]>=5.3,<6",
  "redis>=6.1,<7",
  "PyPDF2>=3.0,<4",
  "PyMuPDF>=1.24,<2; python_version < '3.11'",
  "PyMuPDF>=2.1,<2.2; python_version >= '3.11'",
  "python-jose[cryptography]>=3.3,<4",
  "httpx>=0.27,<0.29",
  "qdrant-client>=1.12,<1.13",
  "sentence-transformers>=3.4,<4",
  "optimum[onnxruntime]>=1.27,<2",
  "torch>=2.6,<2.9",
  "docling>=2.81,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27,<0.29"]
semantic = []  # Backward-compatible extra; semantic dependencies are now required.
# Keep the Optimum 1.x API used by Sentence Transformers 3.x.
onnx = []  # Backward-compatible extra; ONNX is the default required runtime.
openvino = ["optimum-intel[openvino]>=1.25,<1.26", "nncf>=2.16,<3",
            "openvino>=2025.1,<2026", "openvino-tokenizers>=2025.1,<2026", "torch>=2.6,<2.9"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
