# Optional NVIDIA GPU acceleration for the ShreckWorld Docling parser.
# The scripts/compose_up.py launcher detects Docker GPU access and selects this overlay.
services:
  shreckworld_api:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
    environment:
      SHRECKWORLD_PARSER_DEVICE: ${SHRECKWORLD_PARSER_DEVICE:-}
      SHRECKWORLD_EMBEDDING_DEVICE: ${SHRECKWORLD_EMBEDDING_DEVICE:-}
      SHRECKWORLD_EMBEDDING_BACKEND: ${SHRECKWORLD_EMBEDDING_BACKEND:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  shreckworld_worker:
    environment:
      SHRECKWORLD_PARSER_DEVICE: ${SHRECKWORLD_PARSER_DEVICE:-}
      SHRECKWORLD_EMBEDDING_DEVICE: ${SHRECKWORLD_EMBEDDING_DEVICE:-}
      SHRECKWORLD_EMBEDDING_BACKEND: ${SHRECKWORLD_EMBEDDING_BACKEND:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  shreckworld_model_prefetch:
    environment:
      SHRECKWORLD_PARSER_DEVICE: ${SHRECKWORLD_PARSER_DEVICE:-}
      SHRECKWORLD_EMBEDDING_DEVICE: ${SHRECKWORLD_EMBEDDING_DEVICE:-}
      SHRECKWORLD_EMBEDDING_BACKEND: ${SHRECKWORLD_EMBEDDING_BACKEND:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
